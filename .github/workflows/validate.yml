name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check marketplace and plugin manifests
        run: python3 scripts/validate-manifests.py

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # find, not a glob: covers every plugin and nested dirs like scripts/lib
      - name: Run ShellCheck
        run: |
          find plugins -name '*.sh' -print0 | xargs -0 -r shellcheck

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run offline script tests
        run: |
          shopt -s nullglob
          tests=(plugins/*/skills/*/scripts/test-*.sh plugins/*/scripts/test-*.sh)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No test scripts found" >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "::group::${test}"
            bash "${test}"
            echo "::endgroup::"
          done
