# Requested-reviewer selection for every script that lists reviewers. Bots
# (Copilot) and teams do not match a User-only fragment and would silently
# disappear from the reviewer list.
reviewRequests(first: 100) {
  nodes {
    requestedReviewer {
      __typename
      ... on User { login }
      ... on Bot { login }
      ... on Team { slug }
    }
  }
}
